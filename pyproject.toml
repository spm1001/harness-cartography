[project]
name = "harness-cartography"
version = "0.1.0"
description = "Kinetic layer for harness cartography — administers the probe letter across surfaces (passe runners) and scores the reports into cell tables and plots"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["matplotlib"]

[project.scripts]
score = "harness_cartography.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_cartography"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
